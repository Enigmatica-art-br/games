<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0a08">
  <meta name="description" content="The official home of Enigmática’s games.">
  <meta property="og:title" content="Enigmática Games">
  <meta property="og:description" content="Every game from Enigmática, in one place.">
  <meta property="og:image" content="https://games.enigmatica.art.br/assets/images/enigmatica-logo.png">
  <link rel="canonical" href="https://games.enigmatica.art.br/">
  <link rel="icon" href="assets/images/enigmatica-mark.png">
  <link rel="preload" href="assets/fonts/syne-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/games-hub.css?v=20">
  <title>Games — Enigmática</title>
</head>
<body>
  <a class="skip" href="#catalog" data-i18n="skip">Skip to the games</a>

  <header class="bar">
    <a class="home" href="https://enigmatica.art.br/" aria-label="Back to the Enigmática hub" data-i18n-attr="aria-label:homeLabel">
      <img src="assets/images/enigmatica-mark.png" alt="" width="32" height="32">
      <span>Enigmática <b>Games</b></span>
    </a>
    <div class="lang" role="group" aria-label="Language" data-i18n-attr="aria-label:langGroup">
      <button type="button" data-lang="pt" aria-pressed="false" lang="pt-BR" title="Português (Brasil)">PT</button>
      <button type="button" data-lang="en" aria-pressed="true" lang="en" title="English">EN</button>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title" data-i18n="title">Games</h1>
      <div class="intro-side">
        <p class="lede" data-i18n="lede">Worlds made to be crossed. Enigmas made to linger.</p>
        <p class="count" id="count" aria-live="polite"></p>
      </div>
    </section>

    <section class="catalog" id="catalog" aria-labelledby="catalog-title">
      <h2 id="catalog-title" class="sr-only" data-i18n="catalogTitle">Catalog</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter by status" data-i18n-attr="aria-label:filterLabel" hidden></div>
      <ul class="grid" id="grid"></ul>
    </section>
  </main>

  <footer class="foot">
    <span>© <span id="year">2026</span> Enigmática</span>
    <nav class="foot-links" aria-label="Official channels" data-i18n-attr="aria-label:channels">
      <a href="https://www.youtube.com/@enigmatica-art" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://discord.gg/URapb2bbFA" target="_blank" rel="noopener noreferrer">Discord</a>
      <a href="https://www.instagram.com/enigmatica.official/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </footer>

  <script src="assets/games-data.js?v=20"></script>
  <script src="assets/games-i18n.js?v=20"></script>
  <script src="assets/i18n.js?v=20"></script>
  <script src="assets/games-hub.js?v=20"></script>
</body>
</html>
